<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON — Ward 4B Clinical Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow: hidden; }
        header { background: #ffffff; padding: 12px 24px; border-radius: 12px; border: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .header-title { font-size: 20px; font-weight: bold; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .badge-ward { font-size: 11px; background: #dbeafe; color: #1d4ed8; padding: 2px 8px; border-radius: 12px; border: 1px solid #bfdbfe; }
        .badge-live { font-size: 12px; font-weight: 600; color: #047857; background: #ecfdf5; padding: 6px 12px; border-radius: 20px; border: 1px solid #a7f3d0; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
        .btn-ack { background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-ack:hover { background: #b91c1c; }
        
        main { display: grid; grid-template-columns: 5fr 7fr; gap: 16px; flex: 1; min-height: 0; }
        .left-col { display: flex; flex-direction: column; gap: 16px; }
        .right-col { background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 12px; padding: 16px; overflow-y: auto; }
        
        .card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #020617; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #videoStream { width: 100%; height: 100%; object-fit: cover; }
        
        /* Flashing Translucent Red Overlay */
        .fall-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(225, 29, 72, 0.45);
            border: 4px solid #dc2626;
            z-index: 10;
            animation: flashOverlay 1s infinite alternate ease-in-out;
            align-items: center;
            justify-content: center;
        }
        .fall-overlay.active { display: flex; }
        .alert-banner {
            background: #dc2626;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.05em;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes flashOverlay {
            from { opacity: 0.3; }
            to { opacity: 0.95; }
        }

        .terminal-card { 
          flex: 1; 
          display: flex; 
          flex-direction: column; 
          min-height: 0; /* Prevents flex items from expanding beyond parent */
        }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; font-size: 12px; color: #334155; text-transform: uppercase; }
        .btn-voice { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        #logs { 
          flex: 1; 
          background: #0f172a; 
          color: #e2e8f0; 
          border-radius: 8px; 
          padding: 12px; 
          font-family: monospace; 
          font-size: 12px; 
          overflow-y: auto; /* Enables scrolling */
          max-height: 180px; /* Forces fixed bounds so scrollbar appears */
          display: flex; 
          flex-direction: column; 
          gap: 8px; 
        }
        
        .patient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
        .vital-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 16px; }
        .vital-card.critical { border-color: #ef4444; background: #fef2f2; }
        .vital-card.warning { border-color: #f59e0b; background: #fffbeb; }
        
        .vital-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .metric-box { background: #eff6ff; border: 1px solid #dbeafe; padding: 10px; border-radius: 8px; }
        .metric-label { font-size: 11px; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 8px; }
        .metric-value { font-size: 16px; font-weight: bold; color: #0f172a; margin-top: 4px; display: block; }
        
        .icon-large { font-size: 20px; }
        .status-pill { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
        .status-normal { background: #d1fae5; color: #065f46; }
        .status-critical { background: #ffe4e6; color: #9f1239; }
        .status-warning { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <header>
    <div class="header-title">
        <i class="fa-solid fa-heart-pulse icon-large" style="color: #2563eb;"></i>
        <div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 20px; font-weight: 800; tracking-wide: 0.05em;">ULTRON</span>
                <span class="badge-ward">WARD 4B</span>
            </div>
            <div style="font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">
                Unified Life-Tracking & Threat Response Observability Network
            </div>
        </div>
    </div>
    <div style="display: flex; gap: 16px; align-items: center;">
        <div class="badge-live"><div class="pulse-dot"></div> LIVE MONITORING</div>
        <button class="btn-ack" onclick="acknowledgeAlert()"><i class="fa-solid fa-bell-slash icon-large"></i> ACKNOWLEDGE ALERTS</button>
    </div>
</header>

    <main>
        <section class="left-col">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 12px; font-weight: bold; color: #334155; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-video icon-large" style="color: #2563eb;"></i> BED 3 CAM FEED
                    </span>
                    <span style="font-size: 10px; background: #eff6ff; color: #1d4ed8; padding: 2px 6px; font-weight: bold; border-radius: 4px;">1080P • 30 FPS</span>
                </div>
                <div class="video-container">
                    <img id="videoStream" src="" alt="Connecting Camera Stream...">
                    <div id="videoOverlay" class="fall-overlay">
                        <div class="alert-banner">
                            <i class="fa-solid fa-triangle-exclamation icon-large"></i> ATTENTION REQUIRED
                        </div>
                    </div>
                </div>
            </div>

            <div class="card terminal-card">
                <div class="terminal-header">
                    <span><i class="fa-solid fa-terminal icon-large" style="color: #2563eb; margin-right: 6px;"></i> Clinical Logs & Assistant</span>
                    <button class="btn-voice" onclick="triggerVoice()"><i class="fa-solid fa-microphone icon-large"></i> Speak Command</button>
                </div>
                <div id="logs">
                    <div style="color: #94a3b8;">[SYSTEM] System online. Dashboard initialized...</div>
                </div>
            </div>
        </section>

        <section class="right-col">
            <h2 style="font-size: 12px; font-weight: bold; color: #475569; text-transform: uppercase; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-bed icon-large" style="color: #2563eb;"></i> Ward Patient Stations
            </h2>
            <div id="patientGrid" class="patient-grid"></div>
        </section>
    </main>

    <script>
        const ws = new WebSocket(`ws://${location.host}/ws`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "video") {
                document.getElementById("videoStream").src = `data:image/jpeg;base64,${data.frame}`;
            } else if (data.type === "vitals") {
                renderPatients(data.patients);
            } else if (data.type === "alert") {
                const overlay = document.getElementById("videoOverlay");
                if (data.acknowledged) {
                    overlay.classList.remove("active");
                } else if (data.fall || data.type === "alert") {
                    overlay.classList.add("active");
                }
            } else if (data.type === "log") {
                appendLog(data.message);
                if (data.message.includes("[FALL]")) {
                    document.getElementById("videoOverlay").classList.add("active");
                }
            }
        };

        function renderPatients(patients) {
            const grid = document.getElementById("patientGrid");
            grid.innerHTML = patients.map(p => `
                <div class="vital-card ${p.status}">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: bold; font-size: 14px; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-user-doctor icon-large" style="color: #2563eb;"></i> Bed ${p.bed_id} — ${p.patient_name}
                        </span>
                        <span class="status-pill status-${p.status}">${p.status}</span>
                    </div>
                    <div class="vital-metrics">
                        <div class="metric-box">
                            <span class="metric-label"><i class="fa-solid fa-heart icon-large" style="color: #ef4444;"></i> Heart Rate</span>
                            <span class="metric-value">${p.hr}</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fa-solid fa-gauge-high icon-large" style="color: #2563eb;"></i> Blood Pressure</span>
                            <span class="metric-value">${p.bp}</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fa-solid fa-lungs icon-large" style="color: #0284c7;"></i> SpO2</span>
                            <span class="metric-value">${p.spo2}</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fa-solid fa-temperature-half icon-large" style="color: #d97706;"></i> Temp</span>
                            <span class="metric-value">${p.temp}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function appendLog(msg) {
          const logs = document.getElementById("logs");
          const div = document.createElement("div");
          div.textContent = msg;
          logs.appendChild(div);

          // Scroll to bottom
          setTimeout(() => {
              logs.scrollTop = logs.scrollHeight;
          }, 50);
      }

        async function triggerVoice() {
            await fetch('/api/voice/trigger', { method: 'POST' });
        }

        async function acknowledgeAlert() {
            document.getElementById("videoOverlay").classList.remove("active");
            await fetch('/api/alert/acknowledge', { method: 'POST' });
        }
    </script>
</body>
</html>
